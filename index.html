<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panorama View</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --accent-color: #00f0ff;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--accent-color);
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.4);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: var(--text-sub);
      font-size: 1rem;
    }

    .container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      border-color: var(--accent-color);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0, 240, 255, 0.15);
    }

    .card h3 {
      font-size: 1.3rem;
      margin-bottom: 0.5rem;
      color: #fff;
    }

    .card p {
      color: var(--text-sub);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .badge {
      align-self: flex-start;
      background: rgba(0, 240, 255, 0.1);
      color: var(--accent-color);
      border: 1px solid var(--accent-color);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
    }

    .upload-zone {
      background: var(--card-bg);
      border: 2px dashed var(--border-color);
      border-radius: 12px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .upload-zone:hover, .upload-zone.dragover {
      border-color: var(--accent-color);
      background: rgba(0, 240, 255, 0.03);
    }

    .upload-zone p {
      color: var(--text-sub);
      font-size: 1rem;
    }

    .upload-zone strong {
      color: var(--accent-color);
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h1>Panorama View</h1>
    <p class="subtitle">Interaktiver WebXR 360° Panorama Viewer</p>
  </header>

  <div class="container">
    <div class="grid">
      <!-- Projekt 1: Teufelsberg (4 Panoramen) -->
      <div class="card" onclick="openProject('teufelsberg', 4)">
        <div>
          <h3>landscape Teufelsberg</h3>
          <p>4 Panorama-Standorte verfügbar</p>
        </div>
        <span class="badge">4 Panoramen</span>
      </div>

      <!-- Projekt 2: Karlshorst (2 Panoramen) -->
      <div class="card" onclick="openProject('karlshorst', 2)">
        <div>
          <h3>landscape Karlshorst</h3>
          <p>2 Panorama-Standorte verfügbar</p>
        </div>
        <span class="badge">2 Panoramen</span>
      </div>
    </div>

    <!-- Custom Panorama Upload -->
    <div class="upload-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <p>drag or upload your own <strong>Panorama (Format 2:1)</strong> file here</p>
      <input type="file" id="fileInput" accept="image/*">
    </div>
  </div>

  <script>
    function openProject(folder, count) {
      window.location.href = `viewer.html?project=${folder}&count=${count}`;
    }

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');

    ['dragenter', 'dragover'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      }, false);
    });

    ['dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
      }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) handleCustomFile(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleCustomFile(e.target.files[0]);
    });

    function handleCustomFile(file) {
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          sessionStorage.setItem('customPanorama', e.target.result);
        } catch(err) {
          console.warn('sessionStorage gesperrt oder voll, verwende Fallback');
        }
        window.location.href = 'viewer.html?custom=1';
      };
      reader.readAsDataURL(file);
    }
  </script>
</body>
</html>
