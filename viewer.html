<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panorama Viewer</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    // 20° VR-Snap-Turn Komponente
    AFRAME.registerComponent('vr-snap-turn', {
      schema: {
        angle: { type: 'number', default: 20 },
        threshold: { type: 'number', default: 0.6 }
      },
      init: function () {
        this.stickX = 0;
        this.canSnap = true;
        this.onAxisMove = this.onAxisMove.bind(this);
        this.el.addEventListener('thumbstickmoved', this.onAxisMove);
        this.el.addEventListener('axismove', this.onAxisMove);
      },
      onAxisMove: function (evt) {
        const detail = evt.detail || {};
        this.stickX = (typeof detail.x === 'number') ? detail.x : (detail.axis ? detail.axis[0] : 0);
      },
      tick: function () {
        const rig = document.querySelector('#rig');
        if (!rig) return;
        if (this.stickX > this.data.threshold && this.canSnap) {
          this.rotateRig(-this.data.angle);
          this.canSnap = false;
        } else if (this.stickX < -this.data.threshold && this.canSnap) {
          this.rotateRig(this.data.angle);
          this.canSnap = false;
        } else if (Math.abs(this.stickX) < 0.2) {
          this.canSnap = true;
        }
      },
      rotateRig: function (deltaAngle) {
        const rig = document.querySelector('#rig');
        const rot = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        rig.setAttribute('rotation', `${rot.x} ${rot.y + deltaAngle} ${rot.z}`);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      background: #000;
    }

    /* FUTURISTISCHES OVERHEAD / HELMVISIER HUD OVERLAY */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      padding: 20px;
      box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.15);
    }

    /* Links: HUD Menü zur Panoramaauswahl */
    .hud-panel-left {
      pointer-events: auto;
      background: rgba(10, 20, 30, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px;
      width: 220px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-panel-left h4 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0, 240, 255, 0.4);
      padding-bottom: 5px;
    }

    .hud-btn {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      text-align: left;
      transition: all 0.2s ease;
    }

    .hud-btn:hover, .hud-btn.active {
      background: rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    /* Rechts: HUD Minimap / Quadrat */
    .hud-panel-right {
      background: rgba(10, 20, 30, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px;
      width: 160px;
      height: 160px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      position: relative;
    }

    .hud-panel-right .map-title {
      position: absolute;
      top: 8px;
      font-size: 0.65rem;
      letter-spacing: 1px;
    }

    /* Das Quadrat für den Standort */
    .radar-square {
      width: 80px;
      height: 80px;
      border: 2px dashed #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 10px;
    }

    .radar-dot {
      width: 10px;
      height: 10px;
      background-color: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0ff;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    /* Zurück-Button */
    .hud-back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      pointer-events: auto;
      background: rgba(10, 20, 30, 0.8);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- HUD OVERLAY -->
  <div id="hud-overlay">
    <div class="hud-panel-left" id="hudMenu">
      <h4>PANO SELECT</h4>
      <!-- Dynamische Panorama-Buttons -->
    </div>

    <div class="hud-panel-right" id="hudMap">
      <span class="map-title">POS_RADAR</span>
      <div class="radar-square">
        <div class="radar-dot"></div>
      </div>
    </div>

    <button class="hud-back-btn" onclick="window.location.href='index.html'">← BACK TO INDEX</button>
  </div>

  <!-- A-FRAME SCENE -->
  <a-scene
    id="scene"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #000"
  >
    <a-entity id="pano-container" position="0 1.6 0">
      <a-sky id="sky" radius="500" position="0 0 0" class="clickable"></a-sky>
    </a-entity>

    <a-entity id="rig" position="0 0 0">
      <a-camera
        id="cam"
        look-controls="enabled: true; magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true;"
        wasd-controls="enabled: false"
        position="0 1.6 0"
      >
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable; far: 1000"></a-entity>
      </a-camera>

      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 1000; lineColor: #00f0ff"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" vr-snap-turn="angle: 20; threshold: 0.6" raycaster="objects: .clickable; far: 1000; lineColor: #00f0ff"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const isCustom = urlParams.get('custom') === '1';
      const project = urlParams.get('project');
      const count = parseInt(urlParams.get('count')) || 0;

      const sky = document.querySelector('#sky');
      const hudOverlay = document.getElementById('hud-overlay');
      const hudMenu = document.getElementById('hudMenu');

      // Helper: Prüft, ob Bild mit .jpg oder .JPG geladen werden kann
      function setSkySourceWithFallback(basePath) {
        const img = new Image();
        const primaryPath = `${basePath}.jpg`;
        const fallbackPath = `${basePath}.JPG`;

        img.onload = function() {
          sky.setAttribute('src', primaryPath);
        };
        img.onerror = function() {
          sky.setAttribute('src', fallbackPath);
        };
        img.src = primaryPath;
      }

      // 1. Eigenes Panorama (Custom Upload)
      if (isCustom) {
        hudOverlay.style.display = 'none'; // Menü & HUD ausblenden
        let customData = null;
        try {
          customData = sessionStorage.getItem('customPanorama');
        } catch(e) {
          console.warn('Speicherzugriff fehlgeschlagen:', e);
        }

        if (customData) {
          sky.setAttribute('src', customData);
        } else {
          alert('Kein Bilddaten im Speicher gefunden. Bitte nutzen Sie einen lokalen Webserver (z. B. VS Code Live Server / GitHub Pages).');
          window.location.href = 'index.html';
        }
        return;
      }

      // 2. Projekt-Panoramen (Teufelsberg / Karlshorst)
      if (project && count > 0) {
        function loadProjectPanorama(index) {
          const formattedIndex = String(index).padStart(2, '0');
          const basePath = `${project}/pano_${formattedIndex}`;
          
          setSkySourceWithFallback(basePath);

          // Update UI Button-Zustand
          document.querySelectorAll('.hud-btn').forEach((btn, idx) => {
            if (idx + 1 === index) {
              btn.classList.add('active');
            } else {
              btn.classList.remove('active');
            }
          });
        }

        // Generiere HUD-Buttons dynamisch
        for (let i = 1; i <= count; i++) {
          const btn = document.createElement('button');
          btn.className = 'hud-btn';
          btn.innerText = `PANO_0${i}`;
          btn.onclick = () => loadProjectPanorama(i);
          hudMenu.appendChild(btn);
        }

        // Erstes Panorama laden
        loadProjectPanorama(1);
      } else {
        window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
