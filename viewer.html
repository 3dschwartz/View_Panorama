<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Panorama Viewer - VR Lazy HUD</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <script>
    // ---------- 1. KOMPONENTE: LAZY HUD / DAMPED FOLLOW FÜR VR ----------
    AFRAME.registerComponent('lazy-hud', {
      schema: {
        distance: { type: 'number', default: 1.2 },  // Abstand vor der Kamera (Meter)
        speed: { type: 'number', default: 0.05 },     // Dämpfung/Geschwindigkeit (0.01 = sehr träge, 0.1 = schnell)
        offsetX: { type: 'number', default: -0.45 },  // Versatz nach links
        offsetY: { type: 'number', default: 0.15 }    // Versatz nach oben
      },
      init: function () {
        this.cam = document.querySelector('#cam');
        this.targetPos = new THREE.Vector3();
        this.targetRot = new THREE.Quaternion();
        this.camWorldPos = new THREE.Vector3();
        this.camWorldRot = new THREE.Quaternion();
      },
      tick: function () {
        if (!this.cam) return;

        // Position und Rotation der Kamera ermitteln
        this.cam.object3D.getWorldPosition(this.camWorldPos);
        this.cam.object3D.getWorldQuaternion(this.camWorldRot);

        // Zielposition im Raum berechnen (relativ zur Blickrichtung)
        const offset = new THREE.Vector3(this.data.offsetX, this.data.offsetY, -this.data.distance);
        offset.applyQuaternion(this.camWorldRot);
        this.targetPos.copy(this.camWorldPos).add(offset);

        // Sanfte Annäherung der Position (Linear Interpolation)
        this.el.object3D.position.lerp(this.targetPos, this.data.speed);

        // Sanfte Annäherung der Rotation (Spherical Linear Interpolation)
        this.el.object3D.quaternion.slerp(this.camWorldRot, this.data.speed);
      }
    });

    // ---------- 2. KOMPONENTE: 20° VR-SNAP-TURN ----------
    AFRAME.registerComponent('vr-snap-turn', {
      schema: {
        angle: { type: 'number', default: 20 },
        threshold: { type: 'number', default: 0.6 }
      },
      init: function () {
        this.stickX = 0;
        this.canSnap = true;
        this.onAxisMove = this.onAxisMove.bind(this);
        this.el.addEventListener('thumbstickmoved', this.onAxisMove);
        this.el.addEventListener('axismove', this.onAxisMove);
      },
      onAxisMove: function (evt) {
        const detail = evt.detail || {};
        this.stickX = (typeof detail.x === 'number') ? detail.x : (detail.axis ? detail.axis[0] : 0);
      },
      tick: function () {
        const rig = document.querySelector('#rig');
        if (!rig) return;
        if (this.stickX > this.data.threshold && this.canSnap) {
          this.rotateRig(-this.data.angle);
          this.canSnap = false;
        } else if (this.stickX < -this.data.threshold && this.canSnap) {
          this.rotateRig(this.data.angle);
          this.canSnap = false;
        } else if (Math.abs(this.stickX) < 0.2) {
          this.canSnap = true;
        }
      },
      rotateRig: function (deltaAngle) {
        const rig = document.querySelector('#rig');
        const rot = rig.getAttribute('rotation') || { x: 0, y: 0, z: 0 };
        rig.setAttribute('rotation', `${rot.x} ${rot.y + deltaAngle} ${rot.z}`);
      }
    });
  </script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Courier New', Courier, monospace;
      overflow: hidden;
      background: #000;
    }

    /* 2D HUD OVERLAY (Desktop & Mobile) */
    #hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      padding: 20px;
      box-shadow: inset 0 0 100px rgba(0, 240, 255, 0.15);
    }

    .hud-panel-left {
      pointer-events: auto;
      background: rgba(10, 20, 30, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px;
      width: 220px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .hud-panel-left h4 {
      font-size: 0.85rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      border-bottom: 1px solid rgba(0, 240, 255, 0.4);
      padding-bottom: 5px;
    }

    .hud-btn {
      background: rgba(0, 240, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      padding: 8px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
      text-align: left;
      transition: all 0.2s ease;
    }

    .hud-btn:hover, .hud-btn.active {
      background: rgba(0, 240, 255, 0.3);
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
    }

    .hud-panel-right {
      background: rgba(10, 20, 30, 0.65);
      backdrop-filter: blur(8px);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 15px;
      width: 160px;
      height: 160px;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #00f0ff;
      position: relative;
    }

    .hud-panel-right .map-title {
      position: absolute;
      top: 8px;
      font-size: 0.65rem;
      letter-spacing: 1px;
    }

    .radar-square {
      width: 80px;
      height: 80px;
      border: 2px dashed #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      margin-top: 10px;
    }

    .radar-dot {
      width: 10px;
      height: 10px;
      background-color: #00f0ff;
      border-radius: 50%;
      box-shadow: 0 0 8px #00f0ff;
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 0.6; }
      100% { transform: scale(1.3); opacity: 1; }
    }

    .hud-back-btn {
      position: absolute;
      bottom: 20px;
      left: 20px;
      pointer-events: auto;
      background: rgba(10, 20, 30, 0.8);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <!-- 2D HUD OVERLAY FOR SCREEN MODE -->
  <div id="hud-overlay">
    <div class="hud-panel-left" id="hudMenu">
      <h4>PANO SELECT</h4>
    </div>

    <div class="hud-panel-right" id="hudMap">
      <span class="map-title">POS_RADAR</span>
      <div class="radar-square">
        <div class="radar-dot"></div>
      </div>
    </div>

    <button class="hud-back-btn" onclick="window.location.href='index.html'">← BACK TO INDEX</button>
  </div>

  <!-- A-FRAME 3D SCENE -->
  <a-scene
    id="scene"
    vr-mode-ui="enabled: true"
    renderer="antialias: true; colorManagement: true"
    background="color: #000"
  >
    <!-- PANORAMA SKY -->
    <a-entity id="pano-container" position="0 1.6 0">
      <a-sky id="sky" radius="500" position="0 0 0" class="clickable"></a-sky>
    </a-entity>

    <!-- 3D LAZY VR HUD (Wird sanft gedämpft im VR-Raum mitgeführt) -->
    <a-entity id="vr-hud-group" lazy-hud="distance: 1.2; speed: 0.05; offsetX: -0.45; offsetY: 0.15" visible="false">
      <!-- Visier Panel-Hintergrund -->
      <a-plane width="0.38" height="0.55" material="color: #0a141e; opacity: 0.65; transparent: true; shader: flat" border="color: #00f0ff"></a-plane>
      <a-text value="PANO SELECT" position="0 0.22 0.01" align="center" width="0.8" color="#00f0ff" font="monoid"></a-text>

      <!-- Container für dynamische 3D VR-Buttons -->
      <a-entity id="vr-buttons-container" position="0 0.1 0.01"></a-entity>
    </a-entity>

    <!-- CAMERA RIG -->
    <a-entity id="rig" position="0 0 0">
      <a-camera
        id="cam"
        look-controls="enabled: true; magicWindowTrackingEnabled: true; touchEnabled: true; mouseEnabled: true;"
        wasd-controls="enabled: false"
        position="0 1.6 0"
      >
        <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .clickable; far: 1000"></a-entity>
      </a-camera>

      <a-entity id="leftHand" laser-controls="hand: left" raycaster="objects: .clickable; far: 1000; lineColor: #00f0ff"></a-entity>
      <a-entity id="rightHand" laser-controls="hand: right" vr-snap-turn="angle: 20; threshold: 0.6" raycaster="objects: .clickable; far: 1000; lineColor: #00f0ff"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    (function () {
      const urlParams = new URLSearchParams(window.location.search);
      const isCustom = urlParams.get('custom') === '1';
      const project = urlParams.get('project');
      const count = parseInt(urlParams.get('count')) || 0;

      const scene = document.querySelector('a-scene');
      const sky = document.querySelector('#sky');
      const hudOverlay = document.getElementById('hud-overlay');
      const hudMenu = document.getElementById('hudMenu');
      const vrHudGroup = document.getElementById('vr-hud-group');
      const vrButtonsContainer = document.getElementById('vr-buttons-container');

      // Modus-Wechsel: Bei VR-Eintritt wird 2D HUD verborgen & 3D Lazy HUD aktiviert
      scene.addEventListener('enter-vr', function () {
        hudOverlay.style.display = 'none';
        if (!isCustom) vrHudGroup.setAttribute('visible', 'true');
      });

      scene.addEventListener('exit-vr', function () {
        if (!isCustom) hudOverlay.style.display = 'flex';
        vrHudGroup.setAttribute('visible', 'false');
      });

      // Hilfsfunktion: Lade-Fallback für Dateiendungen
      function setSkySourceWithFallback(basePath) {
        const img = new Image();
        const primaryPath = `${basePath}.jpg`;
        const fallbackPath = `${basePath}.JPG`;

        img.onload = function() { sky.setAttribute('src', primaryPath); };
        img.onerror = function() { sky.setAttribute('src', fallbackPath); };
        img.src = primaryPath;
      }

      // 1. Eigenes Panorama laden (IndexedDB)
      if (isCustom) {
        hudOverlay.style.display = 'none';
        vrHudGroup.setAttribute('visible', 'false');

        const request = indexedDB.open('PanoramaDB', 1);
        request.onsuccess = function(e) {
          const db = e.target.result;
          const tx = db.transaction('images', 'readonly');
          const store = tx.objectStore('images');
          const getReq = store.get('customPano');

          getReq.onsuccess = function() {
            if (getReq.result) {
              const objectURL = URL.createObjectURL(getReq.result);
              sky.setAttribute('src', objectURL);
            } else {
              alert('Kein Bild in der Datenbank gefunden.');
              window.location.href = 'index.html';
            }
          };
        };
        return;
      }

      // 2. Projekt-Panoramen laden
      if (project && count > 0) {
        function loadProjectPanorama(index) {
          const formattedIndex = String(index).padStart(2, '0');
          const basePath = `${project}/pano_${formattedIndex}`;
          
          setSkySourceWithFallback(basePath);

          // Update 2D-Buttons
          document.querySelectorAll('.hud-btn').forEach((btn, idx) => {
            if (idx + 1 === index) btn.classList.add('active');
            else btn.classList.remove('active');
          });

          // Update 3D-Buttons (VR)
          document.querySelectorAll('.vr-btn-plane').forEach((btn, idx) => {
            if (idx + 1 === index) {
              btn.setAttribute('material', 'color: #00f0ff; opacity: 0.8');
            } else {
              btn.setAttribute('material', 'color: #0a141e; opacity: 0.6');
            }
          });
        }

        // Generiere Buttons dynamisch für 2D-Overlay UND 3D VR Lazy HUD
        for (let i = 1; i <= count; i++) {
          // A) 2D HTML Button
          const btn2d = document.createElement('button');
          btn2d.className = 'hud-btn';
          btn2d.innerText = `PANO_0${i}`;
          btn2d.onclick = () => loadProjectPanorama(i);
          hudMenu.appendChild(btn2d);

          // B) 3D VR Button Plane
          const yPos = -(i - 1) * 0.09;
          const vrBtnPlane = document.createElement('a-plane');
          vrBtnPlane.setAttribute('class', 'clickable vr-btn-plane');
          vrBtnPlane.setAttribute('position', `0 ${yPos} 0`);
          vrBtnPlane.setAttribute('width', '0.3');
          vrBtnPlane.setAttribute('height', '0.07');
          vrBtnPlane.setAttribute('material', 'color: #0a141e; opacity: 0.6; transparent: true; shader: flat');

          // Rand-Indikator
          const vrBtnOutline = document.createElement('a-plane');
          vrBtnOutline.setAttribute('width', '0.31');
          vrBtnOutline.setAttribute('height', '0.08');
          vrBtnOutline.setAttribute('position', '0 0 -0.001');
          vrBtnOutline.setAttribute('material', 'color: #00f0ff; shader: flat');

          // Text
          const vrText = document.createElement('a-text');
          vrText.setAttribute('value', `PANO 0${i}`);
          vrText.setAttribute('align', 'center');
          vrText.setAttribute('width', '0.7');
          vrText.setAttribute('color', '#ffffff');
          vrText.setAttribute('position', '0 0 0.01');

          vrBtnPlane.appendChild(vrBtnOutline);
          vrBtnPlane.appendChild(vrText);

          // Click-Event im VR-Raum
          vrBtnPlane.addEventListener('click', () => loadProjectPanorama(i));

          vrButtonsContainer.appendChild(vrBtnPlane);
        }

        loadProjectPanorama(1);
      } else {
        window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
